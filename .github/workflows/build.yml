name: Build, test, and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A release inherits the previous catalog, so two tags must not publish competing histories.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'plugin-release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and run all tests
        run: dotnet test TransmissionStreaming.slnx -c Release
      - name: Package plugin
        run: dotnet run --file scripts/Package.cs
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/*.zip
          archive: false
          retention-days: 90
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download verified main artifact when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          run_id=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs" \
            -f branch=main -f event=push -f head_sha="$commit" -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::Tag this commit after its main push CI passes, or rerun this release after that check succeeds."
            exit 1
          fi

          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | endswith(".zip")))][0] // empty')
          mkdir -p artifacts
          if [[ -n "$artifact" ]]; then
            archive_name=$(jq -r '.name' <<< "$artifact")
            download_url=$(jq -r '.archive_download_url' <<< "$artifact")
            # Download the unwrapped plugin ZIP as bytes; gh run download would extract it.
            gh api "$download_url" > "artifacts/${archive_name}"
          fi
      - name: Package versioned release and repository manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! compgen -G 'artifacts/*.zip' > /dev/null; then
            dotnet run --file scripts/Package.cs
          fi
          archives=(artifacts/*.zip)
          archive="${archives[0]}"
          archive_name=$(basename "$archive")
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${archive_name}"
          previous_manifest="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json"
          dotnet run --file scripts/Package.cs --archive "$archive" --source-url "$release_url" --previous-manifest-url "$previous_manifest" --release-tag "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/manifest.json --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest
