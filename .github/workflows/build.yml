name: Build, test, and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A release inherits the previous catalog, so two tags must not publish competing histories.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'plugin-release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and run all tests
        run: dotnet test TransmissionStreaming.slnx -c Release
      - name: Package plugin
        run: dotnet run --file scripts/Package.cs
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/*.zip
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Package versioned release and repository manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          dotnet run --file scripts/Package.cs
          archives=(artifacts/*.zip)
          archive_name=$(basename "${archives[0]}")
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${archive_name}"
          previous_manifest="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json"
          dotnet run --file scripts/Package.cs --source-url "$release_url" --previous-manifest-url "$previous_manifest" --release-tag "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/manifest.json --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest
