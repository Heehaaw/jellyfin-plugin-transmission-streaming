name: Build, test, and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and run all tests
        run: dotnet test JellyfinPlugins.slnx -c Release
      - name: Check player integration behavior
        run: node --test tests/HdrPlayback/Player/*.test.cjs
      - name: Package both plugins
        run: |
          dotnet run --file scripts/Package.cs -- --plugin transmission-streaming
          dotnet run --file scripts/Package.cs -- --plugin hdr-playback
      - name: Upload Transmission artifact
        uses: actions/upload-artifact@v7
        with:
          name: transmission-streaming.zip
          path: artifacts/TransmissionStreaming_0.0.0.0.zip
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload HDR artifact
        uses: actions/upload-artifact@v7
        with:
          name: hdr-playback.zip
          path: artifacts/HDRPlayback_0.0.0.0.zip
          archive: false
          retention-days: 90
          if-no-files-found: error
