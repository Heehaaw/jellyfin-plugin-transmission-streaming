name: Build, test, and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and run all tests
        run: dotnet test JellyfinPlugins.slnx -c Release
      - name: Check player integration behavior
        run: node --test tests/HdrPlayback/Player/*.test.cjs
      - name: Package both plugins
        run: |
          dotnet run --file scripts/Package.cs -- --plugin transmission-streaming
          dotnet run --file scripts/Package.cs -- --plugin hdr-playback
      - name: Upload Transmission artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/TransmissionStreaming_0.0.0.0.zip
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload HDR artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/HDRPlayback_0.0.0.0.zip
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Link to manual release preparation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          {
            echo '## Release preparation'
            echo
            echo "[Prepare a draft release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml)"
            echo
            echo 'Choose **Run workflow**, select the branch, then choose patch, minor, major, or custom.'
            echo
            echo "Tested commit: [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
          } >> "$GITHUB_STEP_SUMMARY"
